<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeonPlan 3D · Furniture gallery</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #070b14; color: #edf5ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% -10%, #193358 0, transparent 36rem), #070b14; }
      header { position: sticky; z-index: 2; top: 0; padding: 20px clamp(18px, 4vw, 52px) 16px; border-bottom: 1px solid #263b58; background: #08101ddd; backdrop-filter: blur(16px); }
      h1 { margin: 0 0 5px; font-size: clamp(22px, 3vw, 34px); letter-spacing: -.04em; }
      .lead { margin: 0 0 16px; color: #9fb1ca; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      input, select { height: 40px; border: 1px solid #334b6d; border-radius: 10px; padding: 0 12px; background: #101b2b; color: inherit; font: inherit; }
      input { width: min(340px, 100%); }
      #gallery-summary { margin-left: auto; color: #83e8bf; font-variant-numeric: tabular-nums; }
      #gallery-summary.has-errors { color: #ff8895; }
      main { padding: 24px clamp(18px, 4vw, 52px) 60px; }
      #gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
      .gallery-card { display: grid; grid-template-columns: 1fr 72px; overflow: hidden; min-height: 285px; border: 1px solid #263b58; border-radius: 16px; background: linear-gradient(145deg, #111c2d, #0b1320); box-shadow: 0 12px 32px #0004; }
      .gallery-card[hidden] { display: none; }
      .gallery-card.is-error { border-color: #a53d50; }
      .preview { display: grid; place-items: center; min-height: 190px; padding: 10px 0 0 10px; color: #ff8895; }
      .preview img { width: 100%; min-width: 0; aspect-ratio: 1; object-fit: contain; }
      .symbol { display: grid; place-items: center; padding: 18px 12px 8px 0; }
      .symbol svg { width: 58px; height: 90px; overflow: visible; fill: none; stroke: #77d7ff; stroke-width: 0.025; vector-effect: non-scaling-stroke; }
      .symbol svg * { vector-effect: non-scaling-stroke; }
      .symbol .fp3d-sym-fill { fill: #193f59; }
      .symbol .footprint { fill: #152b3e; stroke-dasharray: .08 .05; }
      .details { grid-column: 1 / -1; padding: 4px 16px 15px; border-top: 1px solid #1f3048; }
      .title { margin-top: 10px; font-size: 15px; font-weight: 700; }
      code { display: block; margin: 4px 0 8px; color: #7fdcff; font-size: 12px; }
      .meta { color: #8092aa; font-size: 11px; }
      .error { margin-top: 8px; color: #ff8895; font-size: 11px; overflow-wrap: anywhere; }
      .spinner { width: 26px; height: 26px; border: 2px solid #263b58; border-top-color: #60d8ff; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(1turn); } }
      @media (max-width: 640px) { #gallery-summary { width: 100%; margin-left: 0; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Furniture catalog gallery</h1>
      <p class="lead">Renderer 3D và ký hiệu 2D thật của toàn bộ catalog tích hợp.</p>
      <div class="controls">
        <input id="gallery-search" type="search" placeholder="Tìm tên hoặc ID…" autofocus />
        <select id="gallery-group" aria-label="Nhóm"><option value="all">Tất cả nhóm</option></select>
        <span id="gallery-summary" role="status">Đang chuẩn bị…</span>
      </div>
    </header>
    <main><section id="gallery-grid" aria-label="Furniture catalog"></section></main>
    <script type="module" src="/assets/furniture-gallery.js"></script>
  </body>
</html>

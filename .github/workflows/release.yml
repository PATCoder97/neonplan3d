name: Release

# On a version tag: check that the tag matches the manifest version, pack the integration as
# neonplan3d.zip (HACS installs this file because hacs.json sets zip_release), then create the GitHub
# release and attach the archive. Its download count is the number of HACS installs and updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json; print(json.load(open('custom_components/neonplan3d/manifest.json'))['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - name: Pack the integration
        run: |
          cd custom_components/neonplan3d
          find . -name '__pycache__' -prune -o -type f -print | sed 's|^\./||' | sort > /tmp/files
          zip -q -X ../../neonplan3d.zip -@ < /tmp/files
          cd ../..
          unzip -l neonplan3d.zip | tail -1
      - name: Create the release and attach the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" neonplan3d.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" neonplan3d.zip \
              --verify-tag \
              --generate-notes \
              --title "NeonPlan 3D $GITHUB_REF_NAME"
          fi
